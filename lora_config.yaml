# LoRA reader for ask.py. Run from the repo root:
#   .venv-mlx/bin/python -m mlx_lm lora -c lora_config.yaml
model: mlx-community/Qwen2.5-3B-Instruct-4bit
train: true
data: data/qa/lora
fine_tune_type: lora
mask_prompt: true  # loss on the reply only, not on the retrieved excerpts
num_layers: 16
batch_size: 4
iters: 1330  # one epoch: 5327 examples / batch 4
learning_rate: 1.0e-4
steps_per_report: 20
steps_per_eval: 200
val_batches: -1
save_every: 200
adapter_path: adapters/qa
max_seq_length: 2048
grad_checkpoint: true
seed: 0
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
